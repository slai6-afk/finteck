<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#181816; font-family:'Mulish',system-ui,sans-serif; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  ::-webkit-scrollbar { width:0; }
  input, button, select { font-family:inherit; }

  .phone-wrap { position:relative; filter:drop-shadow(0 50px 100px rgba(0,0,0,.9)); }
  .phone-bezel {
    width:410px; height:872px; border-radius:54px;
    background:linear-gradient(160deg,#2E2E2C,#1A1A18);
    padding:10px; position:relative;
  }
  .btn-side-r { position:absolute; right:-4px; top:160px; width:4px; height:72px;
    background:#2A2A28; border-radius:0 3px 3px 0; }
  .btn-side-l1 { position:absolute; left:-4px; top:130px; width:4px; height:44px;
    background:#2A2A28; border-radius:3px 0 0 3px; }
  .btn-side-l2 { position:absolute; left:-4px; top:184px; width:4px; height:44px;
    background:#2A2A28; border-radius:3px 0 0 3px; }
  .btn-side-l3 { position:absolute; left:-4px; top:248px; width:4px; height:64px;
    background:#2A2A28; border-radius:3px 0 0 3px; }
  .phone-screen {
    width:100%; height:100%; border-radius:46px;
    overflow:hidden; background:white; position:relative;
    display:flex; flex-direction:column;
  }
  .phone-island {
    position:absolute; top:13px; left:50%; transform:translateX(-50%);
    width:120px; height:36px; background:#0E0E0C; border-radius:20px;
    z-index:500; pointer-events:none;
  }
  .screen-in  { animation:sIn  .3s cubic-bezier(.4,0,.2,1) both; }
  .screen-out { animation:sOut .3s cubic-bezier(.4,0,.2,1) both; }
  @keyframes sIn  { from{transform:translateX(32px);opacity:0} to{transform:none;opacity:1} }
  @keyframes sOut { from{transform:none;opacity:1} to{transform:translateX(-20px);opacity:0} }

  #tweak-panel {
    position:fixed; bottom:20px; right:20px; background:#FFFFFF;
    border-radius:20px; padding:20px; width:240px;
    box-shadow:0 16px 48px rgba(0,0,0,.35); display:none; z-index:9999;
  }
  #tweak-panel h4 { font-family:'Playfair Display',serif; font-size:15px; font-weight:700;
    color:#2D2D2D; margin:0 0 16px; }
  .tw-row { display:flex; align-items:center; justify-content:space-between;
    padding:8px 0; border-bottom:1px solid #F0EDE5; gap:8px; }
  .tw-row:last-child { border-bottom:none; padding-bottom:0; }
  .tw-label { font-size:11px; color:#7E7E79; font-weight:700; letter-spacing:.3px; font-family:'Mulish',sans-serif; }

  .hint {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.07); color:rgba(255,255,255,.35);
    font-family:'Poppins',sans-serif; font-size:11px; padding:5px 16px;
    border-radius:100px; letter-spacing:.4px; pointer-events:none; white-space:nowrap;
  }
  #screen-map {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(24,24,22,.96); border-radius:20px; padding:24px;
    display:none; z-index:8000; flex-direction:column; gap:8px;
    max-width:340px; width:90%; backdrop-filter:blur(10px);
  }
  #screen-map h3 { font-family:'Playfair Display',serif; font-size:18px; color:white; margin:0 0 12px; }
  .sm-btn { padding:8px 14px; border-radius:8px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12); color:rgba(255,255,255,.8); cursor:pointer;
    font-family:'Mulish',sans-serif; font-size:12px; font-weight:700; text-align:left;
    transition:background .15s; }
  .sm-btn:hover { background:rgba(248,178,189,.2); color:white; }
  .sm-close { position:absolute; top:12px; right:14px; background:none; border:none;
    color:rgba(255,255,255,.4); cursor:pointer; font-size:18px; }

function Icon({ name, size=22, color='currentColor', strokeWidth=2 }) {
  const paths = ICON_PATHS[name];
  if (!paths) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
      {paths}
    </svg>
  );
}

  return (
    <div style={{ position:'absolute', top:0, left:0, right:0, height:60,

    { id:'profile',  label:'Profile', icon:<><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></> },
  ];
  return (
    <div style={{ position:'absolute', bottom:0, left:0, right:0, height:84,
      backgroundColor:P.color.white, borderTop:`1px solid ${P.color.border}`,
      display:'flex', alignItems:'flex-start', paddingTop:8, zIndex:50 }}>
      {tabs.map(t => {
        const isActive = active === t.id;
        const isGuide = guideTab === t.id;
        return (
          <button key={t.id} onClick={() => onTab(t.id)}
            style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center',
              gap:3, background:'none', border:'none', cursor:'pointer',
              color: isActive ? P.color.green : P.color.ink4, transition:'color .2s' }}>
            <div className={isGuide ? 'nav-guide-pulse' : ''}
              style={{ width:42, height:36, borderRadius:P.r.pill,
              backgroundColor: isActive ? P.color.greenLight : 'transparent',
              display:'flex', alignItems:'center', justifyContent:'center', transition:'background .2s',
              boxShadow:isGuide ? '0 0 0 2px rgba(12,69,36,.18)' : 'none' }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" strokeWidth={isActive?2.2:1.8} strokeLinecap="round" strokeLinejoin="round">
                {t.icon}
              </svg>
            </div>
            <span style={{ fontFamily:P.font.ui, fontSize:10,
              fontWeight: isActive ? 600 : 400, letterSpacing:.3 }}>
              {t.label}
            </span>
          </button>
        );
      })}
    </div>
  );
}

// ─── BUTTON ──────────────────────────────────────────────────────
function PBtn({ label, onClick, variant='primary', icon, style:s={} }) {
  const base = { width:'100%', height:56, borderRadius:P.r.md, cursor:'pointer',
    fontFamily:P.font.display, fontSize:17, letterSpacing:'.3px', border:'none',
    transition:'opacity .15s, transform .1s', display:'flex',
    alignItems:'center', justifyContent:'center', gap:8 };
  const vars = {
    primary:   { backgroundColor:P.color.green,  color:P.color.white  },
    secondary: { backgroundColor:'transparent',   color:P.color.green,
                 border:`1.5px solid ${P.color.green}` },
    pink:      { backgroundColor:P.color.pink,    color:P.color.black  },
    sand:      { backgroundColor:P.color.sand,    color:P.color.black  },
    ghost:     { backgroundColor:'transparent',   color:P.color.ink3, border:'none' },
    dark:      { backgroundColor:P.color.black,   color:P.color.white  },
    danger:    { backgroundColor:'transparent',   color:P.color.impulsive,
                 border:`1.5px solid ${P.color.impulsive}` },
  };
  return (
    <button onClick={onClick}
      onMouseDown={e=>e.currentTarget.style.transform='scale(.97)'}
      onMouseUp={e=>e.currentTarget.style.transform='scale(1)'}
      style={{...base,...vars[variant],...s}}>
      {icon && icon}{label}
    </button>
  );
}

// ─── BACK BUTTON ─────────────────────────────────────────────────
function BackBtn({ onClick, light=false }) {
  return (
    <button onClick={onClick} style={{ position:'absolute', top:54, left:20,
      width:38, height:38, borderRadius:'50%',
      backgroundColor: light ? 'rgba(255,255,255,.25)' : P.color.stone,
      border:'none', cursor:'pointer', display:'flex', alignItems:'center',
      justifyContent:'center', zIndex:10 }}>
      <Icon name="chevLeft" size={20} color={light ? P.color.white : P.color.black} />
    </button>
  );
}

// ─── INPUT ───────────────────────────────────────────────────────
function PInput({ placeholder, type='text', value, onChange, iconName }) {
  const [focused, setFocused] = React.useState(false);
  return (
    <div style={{ position:'relative', width:'100%' }}>
      {iconName && (
        <div style={{ position:'absolute', left:14, top:'50%', transform:'translateY(-50%)',
          color:P.color.ink4, display:'flex', pointerEvents:'none' }}>
          <Icon name={iconName} size={18} color={P.color.ink4} />
        </div>
      )}
      <input type={type} placeholder={placeholder} value={value} onChange={onChange}
        onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
        style={{ width:'100%', height:52, borderRadius:P.r.md,
          border:`1.5px solid ${focused ? P.color.green : P.color.border}`,
          backgroundColor:P.color.white, fontFamily:P.font.body, fontSize:15,
          color:P.color.black, paddingLeft:iconName?44:16, paddingRight:16,
          outline:'none', transition:'border .2s', boxSizing:'border-box' }}/>
    </div>
  );
}

// ─── SPEND TAG ───────────────────────────────────────────────────
function SpendTag({ type }) {
  const map = {
    aligned:   { label:'Aligned',   bg:P.color.alignedTint,   color:P.color.aligned   },
    neutral:   { label:'Neutral',   bg:P.color.neutralTint,   color:P.color.neutral   },
    impulsive: { label:'Impulsive', bg:P.color.impulsiveTint, color:P.color.impulsive },
  };
  const t = map[type]||map.neutral;
  return (
    <span style={{ fontFamily:P.font.body, fontSize:11, fontWeight:700,
      color:t.color, backgroundColor:t.bg, borderRadius:P.r.pill,
      padding:'3px 10px', letterSpacing:.4, display:'inline-block' }}>
      {t.label}
    </span>
  );
}

// ─── PROGRESS BAR ────────────────────────────────────────────────
function ProgressBar({ value, max, color=P.color.green }) {
  const pct = Math.min(100, (value/max)*100);
  return (
    <div style={{ width:'100%', height:8, borderRadius:P.r.pill,
      backgroundColor:P.color.stone, overflow:'hidden' }}>
      <div style={{ width:`${pct}%`, height:'100%', borderRadius:P.r.pill,
        backgroundColor:color, transition:'width .6s ease' }}/>
    </div>
  );
}

// ─── CATEGORY ICON BOX ───────────────────────────────────────────
function CatIcon({ id, size=44, bg=P.color.stone, color=P.color.black }) {
  const meta = CAT_META[id] || { icon:'shopping', label:id };
  return (
    <div style={{ width:size, height:size, borderRadius:P.r.md,
      backgroundColor:bg, display:'flex', alignItems:'center',
      justifyContent:'center', flexShrink:0 }}>
      <Icon name={meta.icon} size={size*0.48} color={color} />
    </div>
  );
}

// ── Create Account ────────────────────────────────────────────────
function ScreenCreateAccount({ nav }) {
  const [form, setForm] = React.useState({ name:'', email:'', phone:'', pass:'', confirm:'' });
  const set = k => e => setForm(f=>({...f,[k]:e.target.value}));
  return (
    <div style={{ flex:1, backgroundColor:P.color.white, display:'flex',
      flexDirection:'column', padding:'0 28px', position:'relative', overflowY:'auto' }}>
      <StatusBar />
      <BackBtn onClick={() => nav('__back__')} />
      <div style={{ paddingTop:108, paddingBottom:40 }}>
        <h1 style={{ fontFamily:P.font.display, fontWeight:700, fontSize:28,
          color:P.color.black, margin:'0 0 6px', letterSpacing:'-.4px' }}>Create Account</h1>
        <p style={{ fontFamily:P.font.body, fontSize:13, color:P.color.ink3, margin:'0 0 28px' }}>
          Start your journey toward intentional spending
        </p>
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          <PInput placeholder="Full Name" value={form.name} onChange={set('name')} iconName="user" />
          <PInput placeholder="Email Address" type="email" value={form.email} onChange={set('email')} iconName="mail" />
          <PInput placeholder="Phone Number" type="tel" value={form.phone} onChange={set('phone')} iconName="phone" />
          <PInput placeholder="Password" type="password" value={form.pass} onChange={set('pass')} iconName="lock" />
          <PInput placeholder="Confirm Password" type="password" value={form.confirm} onChange={set('confirm')} iconName="check" />
        </div>
        <div style={{ marginTop:28 }}>
          <PBtn label="Create Account" onClick={() => nav('verifyEmail')} />

// ── Step 2: Tournament — 1v1 ranking ─────────────────────────────
function ScreenPrioritizeTournament({ nav, priorities, setRanked }) {
  // Build comparison pairs from selected items
  const items = React.useMemo(() => {
    const cats = priorities.length ? priorities : ['dining','travel','fitness','social','shopping'];
    return cats;
  }, [priorities]);

  // Generate N-1 matchups for a "king of the hill" style ranking
  const buildMatchups = (items) => {
    const matchups = [];
    for (let i = 0; i < items.length - 1; i++) {
      matchups.push([items[i], items[i+1]]);
    }
    // Add a few more cross comparisons for better ranking
    if (items.length > 3) {
      matchups.push([items[0], items[2]]);
      if (items.length > 4) matchups.push([items[1], items[3]]);
    }
    return matchups;
  };

  const [matchups] = React.useState(() => buildMatchups(items));
  const [round, setRound] = React.useState(0);
  const [wins, setWins] = React.useState(() => Object.fromEntries(items.map(id=>[id,0])));

  const choose = (winnerId) => {
    setWins(w => ({...w, [winnerId]: (w[winnerId]||0)+1}));
    if (round + 1 >= matchups.length) {
      // Done — sort by wins and go to result
      const sorted = [...items].sort((a,b) => ((wins[b]||0)+(b===winnerId?1:0)) - ((wins[a]||0)+(a===winnerId?1:0)));
      setRanked(sorted);
      nav('priorityResult');
    } else {
      setRound(r=>r+1);
    }
  };

  if (round >= matchups.length) return null;
  const [itemA, itemB] = matchups[round];
  const metaA = CAT_META[itemA] || { icon:'shopping', label:itemA };
  const metaB = CAT_META[itemB] || { icon:'shopping', label:itemB };
  const progress = (round / matchups.length) * 100;

  return (
    <div style={{ flex:1, backgroundColor:P.color.cream, display:'flex',
      flexDirection:'column', position:'relative', overflow:'hidden' }}>
      <StatusBar />
      {/* Progress */}
      <div style={{ position:'absolute', top:48, left:60, right:24, height:6,
        borderRadius:P.r.pill, backgroundColor:P.color.stone, overflow:'hidden', zIndex:10 }}>
        <div style={{ width:`${progress}%`, height:'100%', borderRadius:P.r.pill,
          backgroundColor:P.color.green, transition:'width .4s ease' }}/>
      </div>
      <BackBtn onClick={() => round > 0 ? setRound(r=>r-1) : nav('prioritizeSelect')} />

      <div style={{ paddingTop:72, flex:1, display:'flex', flexDirection:'column',
        padding:'72px 24px 24px' }}>
        <div style={{ marginBottom:8 }}>
          <span style={{ fontFamily:P.font.body, fontSize:11, color:P.color.ink3,
            fontWeight:700, textTransform:'uppercase', letterSpacing:.8 }}>
            Round {round+1} of {matchups.length}
          </span>
        </div>
        <h2 style={{ fontFamily:P.font.display, fontWeight:700, fontSize:24,
          color:P.color.black, margin:'0 0 8px', letterSpacing:'-.3px', lineHeight:1.2 }}>
          Which matters<br/>more to you?
        </h2>
        <p style={{ fontFamily:P.font.body, fontSize:13, color:P.color.ink3,
          margin:'0 0 22px', lineHeight:1.5 }}>
          Pick the one you care more.
        </p>

        {/* LEFT / RIGHT wrapper */}
        <div style={{ display:'flex', flexDirection:'row', gap:12,
          alignItems:'flex-start', position:'relative', justifyContent:'space-between' }}>
          {[{id:itemA,meta:metaA,side:'left'},{id:itemB,meta:metaB,side:'right'}].map(({id,meta,side})=>{
            const isLeft = side==='left';
            return (
              <button key={id} onClick={()=>choose(id)}
                onMouseDown={e=>{e.currentTarget.style.transform=`scale(.95) rotate(${isLeft?'-2deg':'2deg'})`;}}
                onMouseUp={e=>{e.currentTarget.style.transform='scale(1) rotate(0deg)';}}
                style={{ flex:'0 0 155px', height:300, backgroundColor:P.color.white, borderRadius:P.r.xl,
                  padding:'28px 16px', display:'flex', flexDirection:'column',
                  alignItems:'center', justifyContent:'center', gap:18,
                  border:`2px solid ${P.color.border}`, cursor:'pointer',
                  boxShadow:P.shadow.md, transition:'all .18s cubic-bezier(.4,0,.2,1)',
                  minHeight:300, maxHeight:300 }}>
                <div style={{ width:80, height:80, borderRadius:P.r.xl,
                  backgroundColor:isLeft?P.color.pinkLight:P.color.greenLight,
                  display:'flex', alignItems:'center', justifyContent:'center' }}>
                  <Icon name={meta.icon} size={40} color={isLeft?P.color.impulsive:P.color.green} />
                </div>
                <p style={{ fontFamily:P.font.display, fontWeight:700, fontSize:18,
                  color:P.color.black, margin:0, textAlign:'center',
                  letterSpacing:'-.2px', lineHeight:1.2 }}>
                  {meta.label}
                </p>
                <div style={{ width:40, height:40, borderRadius:'50%',

                  display:'flex', alignItems:'center', justifyContent:'center',
                  border:`2px solid ${isLeft?P.color.pink:P.color.green}` }}>
                  <Icon name={isLeft?'chevLeft':'chevRight'} size={20}
                    color={isLeft?P.color.impulsive:P.color.green} strokeWidth={2.5}/>
                </div>
              </button>
            );
          })}
        </div>

        {/* VS divider — between cards visually */}
        <div style={{ position:'absolute', left:'50%', top:250,
          transform:'translate(-50%,-50%)', zIndex:10,
          width:40, height:40, borderRadius:'50%',
          backgroundColor:P.color.sand, border:`2px solid ${P.color.border}`,
          display:'flex', alignItems:'center', justifyContent:'center',
          boxShadow:P.shadow.sm, pointerEvents:'none' }}>
          <span style={{ fontFamily:P.font.display, fontWeight:700, fontSize:11,
            color:P.color.black }}>VS</span>
        </div>

        <button onClick={()=>choose(itemA)}
          style={{ background:'none', border:'none', cursor:'pointer',
            fontFamily:P.font.body, fontSize:12, color:P.color.ink4,
            marginTop:8, textDecoration:'underline' }}>
          They're equally important →
        </button>
      </div>
      <HomeIndicator />
    </div>
  );
}

  const colors      = [P.color.green,P.color.neutral,P.color.impulsive,'#5B8FA8','#7B6BAA'];
  const r=68, cx=80, cy=80, circ=2*Math.PI*r;

    const pct=c.amount/donutTotal, dash=pct*circ-2, gap=circ-dash;
    const s={...c, dash, gap, offset, color:colors[i]};
    offset+=pct*circ; return s;
  });

function ScreenAdjustment({ nav, routineGoals, onSaveAdjustment }) {
  const [editing, setEditing] = React.useState(null);
  const [items, setItems] = React.useState(
    (routineGoals || []).map((g, i) => ({
      id:g.id, cat:g.cat, name:g.name, max:g.amount, priority:i+1
    }))
  );
  const [heroCat, setHeroCat] = React.useState(items[0]?.cat || 'dineOut');

  React.useEffect(() => {
    setItems((routineGoals || []).map((g, i) => ({
      id:g.id, cat:g.cat, name:g.name, max:g.amount, priority:i+1
    })));
  }, [routineGoals]);

  const updateMax = (id, val) => {
    setItems(prev => prev.map(i => i.id===id ? {...i, max: Math.max(0, parseInt(val) || 0)} : i));
  };

  const save = () => {
    const patched = (routineGoals || []).map(g => {
      const hit = items.find(i => i.id === g.id);
      return hit ? {...g, amount: hit.max} : g;

    onSaveAdjustment && onSaveAdjustment(patched);
    nav('goalBuilderSuccess', { mode:'routine' });

          <div style={{ height:182, backgroundColor:P.color.sandLight, position:'relative' }}>
            <div style={{ position:'absolute', inset:0, opacity:.18, backgroundImage:`repeating-linear-gradient(45deg,${P.color.black} 0,${P.color.black} 1px,transparent 0,transparent 28%)`, backgroundSize:'22px 22px' }}/>

              <CatIcon id={heroCat} size={52} bg="rgba(255,255,255,.78)" color={P.color.green}/>

              </div>

          <div style={{ padding:'14px 14px 16px', display:'flex', gap:8, flexWrap:'wrap' }}>
            {items.slice(0,6).map(i => (
              <button key={i.id} onClick={() => setHeroCat(i.cat)}

// ─── iOS Bottom Sheet ────────────────────────────────────────────
function BottomSheet({ open, onClose, title, children, height='80%' }) {
  const [vis, setVis] = React.useState(false);
  React.useEffect(()=>{ if(open){setTimeout(()=>setVis(true),10);}else setVis(false); },[open]);
  React.useEffect(() => {
    if (!open) return;
    const onKey = (e) => {
      if (e.key === 'Escape') onClose && onClose();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open && !vis) return null;
  return (
    <div style={{ position:'absolute', inset:0, zIndex:300 }}>
      <div onClick={onClose} style={{ position:'absolute', inset:0,
        backgroundColor:vis?'rgba(0,0,0,.45)':'rgba(0,0,0,0)',
        transition:'background .3s', backdropFilter:vis?'blur(3px)':'none' }}/>
      <div style={{ position:'absolute', bottom:0, left:0, right:0, height,
        backgroundColor:P.color.white, borderRadius:'24px 24px 0 0',
        transform:vis?'translateY(0)':'translateY(100%)',
        transition:'transform .35s cubic-bezier(.4,0,.2,1)',
        display:'flex', flexDirection:'column', overflow:'hidden',
        boxShadow:'0 -4px 40px rgba(0,0,0,.18)' }}>
        <div style={{ display:'flex', justifyContent:'center', padding:'12px 0 4px', flexShrink:0 }}>
          <div style={{ width:36, height:4, borderRadius:2, backgroundColor:P.color.border }}/>
        </div>
        {title && (
          <div style={{ padding:'4px 20px 14px', borderBottom:`1px solid ${P.color.border}`, flexShrink:0 }}>
            <h3 style={{ fontFamily:P.font.display, fontWeight:700, fontSize:18,
              color:P.color.black, margin:0, letterSpacing:'-.3px', textAlign:'center' }}>{title}</h3>
          </div>
        )}
        <div style={{ flex:1, overflowY:'auto' }}>{children}</div>
      </div>
    </div>
  );
}

function ReflectionPopup({ open, onClose, onComplete }) {
  const [idx, setIdx] = React.useState(0);
  const [ratings, setRatings] = React.useState({});
  const [pulse, setPulse] = React.useState(false);
  const [bursts, setBursts] = React.useState([]);
  const item = REFLECTION_ITEMS[idx];
  const rating = ratings[item?.id];

  React.useEffect(() => {
    if (open) {
      setIdx(0);
      setRatings({});
      setPulse(false);
      setBursts([]);
    }
  }, [open]);

  if (!open) return null;

  const shootEmoji = (emoji) => {
    const group = Date.now() + Math.random();
    const particles = Array.from({ length:8 }).map((_, i) => ({
      id: `${group}-${i}`,
      emoji,
      left: 48 + (Math.random() * 18 - 9),
      delay: i * 0.03,
      rot: Math.random() * 40 - 20,
    }));
    setBursts(prev => [...prev, ...particles]);
    setTimeout(() => {
      setBursts(prev => prev.filter(p => !String(p.id).startsWith(String(group))));
    }, 1100);
  };

  const choose = (value) => {
    setRatings(prev => ({ ...prev, [item.id]: value }));
    setPulse(true);
    setTimeout(() => setPulse(false), 260);
    if (value === 'regret') shootEmoji('😵');
    if (value === 'neutral') shootEmoji('🙂');
    if (value === 'worth') shootEmoji('😍');
  };

  const next = () => {
    if (idx < REFLECTION_ITEMS.length - 1) {
      setIdx(i => i + 1);
      return;
    }
    onComplete && onComplete(ratings);
    onClose && onClose();
  };

  return (
    <div style={{ position:'absolute', inset:0, zIndex:620 }}>
      <div style={{ position:'absolute', inset:0, backgroundColor:'rgba(25,25,24,.5)', backdropFilter:'blur(4px)' }}/>
      <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 16px' }}>
      <div style={{ width:'100%', maxWidth:356, backgroundColor:P.color.white, borderRadius:24, boxShadow:P.shadow.lg, overflow:'hidden',
        animation:'popupCardIn .32s cubic-bezier(.22,1,.36,1) both' }}>
        <div style={{ padding:'14px 16px 10px', borderBottom:`1px solid ${P.color.border}` }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <p style={{ margin:0, fontFamily:P.font.display, fontWeight:700, fontSize:23, color:P.color.black }}>Quick Reflection</p>
            <button onClick={onClose} style={{ border:'none', background:'none', cursor:'pointer' }}>
              <Icon name="close" size={20} color={P.color.ink3}/>
            </button>
          </div>
          <p style={{ margin:'4px 0 0', fontFamily:P.font.body, fontSize:12, color:P.color.ink3 }}>
            {idx+1}/{REFLECTION_ITEMS.length} - Rate how this spend felt.
          </p>
        </div>

        <div key={item.id} style={{ padding:'12px 16px 14px', animation:'fadeSlideUp .25s ease both' }}>
          <div style={{ position:'relative', zIndex:2, pointerEvents:'none' }}>
            {bursts.map(p => (
              <span key={p.id}
                style={{ position:'absolute', left:`${p.left}%`, top:156,
                  fontSize:20, transform:`rotate(${p.rot}deg)`,
                  animation:`emojiBurst .85s ease-out ${p.delay}s forwards`, opacity:0 }}>
                {p.emoji}
              </span>
            ))}
          </div>
          <div style={{ borderRadius:18, overflow:'hidden', backgroundColor:P.color.stone }}>
            <img src={item.image} alt={item.title} style={{ width:'100%', height:168, objectFit:'cover', display:'block' }}/>
          </div>
          <div style={{ marginTop:10 }}>
            <p style={{ margin:'0 0 3px', fontFamily:P.font.body, fontWeight:700, fontSize:15, color:P.color.black }}>{item.title}</p>
            <p style={{ margin:'0 0 2px', fontFamily:P.font.body, fontSize:12, color:P.color.ink3 }}>{item.place}</p>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <span style={{ fontFamily:P.font.display, fontWeight:700, fontSize:26, color:P.color.black }}>${item.price.toFixed(2)}</span>
              <span style={{ fontFamily:P.font.body, fontSize:11, color:P.color.ink3 }}>{item.time}</span>
            </div>
          </div>

          <div style={{ marginTop:10, display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
            {[
              { id:'regret', emoji:'😵', label:'Oops' },
              { id:'neutral', emoji:'🙂', label:'Okay' },
              { id:'worth', emoji:'😍', label:'Worth it' },
            ].map(opt => {
              const on = rating === opt.id;
              return (
                <button key={opt.id} onClick={() => choose(opt.id)}
                  style={{ border:'none', borderRadius:14, padding:'10px 6px 8px', cursor:'pointer',
                    backgroundColor:on ? P.color.greenLight : P.color.stone,
                    transform:on && pulse ? 'scale(1.05)' : 'scale(1)',
                    transition:'all .16s ease', boxShadow:on ? '0 6px 14px rgba(12,69,36,.12)' : 'none' }}>
                  <div style={{ fontSize:18, lineHeight:1 }}>{opt.emoji}</div>
                  <div style={{ marginTop:5, fontFamily:P.font.body, fontWeight:700, fontSize:11, color:on ? P.color.green : P.color.ink2 }}>{opt.label}</div>
                </button>
              );
            })}
          </div>
          <button onClick={next} disabled={!rating}
            style={{ marginTop:12, width:'100%', height:46, border:'none', borderRadius:23,
              backgroundColor:rating ? P.color.green : P.color.ink4, color:P.color.white,
              fontFamily:P.font.body, fontWeight:700, fontSize:14, cursor:rating?'pointer':'not-allowed' }}>
            {idx < REFLECTION_ITEMS.length - 1 ? 'Next Card' : 'Finish Reflection'}
          </button>
        </div>
      </div>
      </div>
    </div>
  );
}

  React.useEffect(() => {
    if (!open) return;
    setStatus({ boa:'idle', chase:'idle', amex:'idle', citi:'idle', wells:'idle' });
  }, [open]);

  if (!open) return null;

  const hasConnected = Object.values(status).includes('connected');

// ─── SPIRAL STREAK BOARD ─────────────────────────────────────────
const STREAK_DATA = Array.from({length:30},(_, i)=>({
  day:i+1, done:i<5, points:i<5?[10,12,8,15,10][i]:0,
  label:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i%7]
}));

function SpiralBoard({ streak, currentDay, W=320, H=380 }) {
  const cols=5, padX=38, padY=40;
  const rows=Math.ceil(streak.length/cols);
  const cellW=(W-padX*2)/(cols-1);
  const cellH=(H-padY*2)/(rows-1);
  // Slight y-jitter per column for organic stepping-stone feel
  const jitter=[0,-9,7,-7,0];
  const pts=[];
  for(let r=0;r<rows;r++){
    const rowItems=Math.min(cols,streak.length-r*cols);
    const rev=r%2===1;
    for(let c=0;c<rowItems;c++){
      const ci=rev?(rowItems-1-c):c;
      const jy=jitter[ci%jitter.length];
      pts.push({x:padX+ci*cellW, y:padY+r*cellH+jy, idx:r*cols+c});
    }
  }
  // Catmull-Rom → cubic bezier smooth path
  function smoothPath(ps){
    if(ps.length<2) return '';
    if(ps.length===2) return `M ${ps[0].x} ${ps[0].y} L ${ps[1].x} ${ps[1].y}`;
    let d=`M ${ps[0].x} ${ps[0].y}`;
    for(let i=0;i<ps.length-1;i++){
      const p0=ps[Math.max(0,i-1)], p1=ps[i], p2=ps[i+1], p3=ps[Math.min(ps.length-1,i+2)];
      const cp1x=(p1.x+(p2.x-p0.x)/6).toFixed(1), cp1y=(p1.y+(p2.y-p0.y)/6).toFixed(1);
      const cp2x=(p2.x-(p3.x-p1.x)/6).toFixed(1), cp2y=(p2.y-(p3.y-p1.y)/6).toFixed(1);
      d+=` C ${cp1x} ${cp1y} ${cp2x} ${cp2y} ${p2.x} ${p2.y}`;
    }
    return d;
  }
  const doneCount=streak.filter(d=>d.done).length;
  const pathD=smoothPath(pts);
  const donePts=pts.filter(p=>p.idx<doneCount);
  const doneD=donePts.length>1?smoothPath(donePts):'';

  const curPt=pts.find(p=>p.idx===doneCount); // current (today's) node

  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}>
      {/* Dashed road */}
      <path d={pathD} fill="none" stroke={P.color.border}
        strokeWidth="3" strokeDasharray="5 5" strokeLinecap="round"/>
      {/* Completed road */}
      {doneD && <path d={doneD} fill="none" stroke={P.color.green}
        strokeWidth="5" strokeLinecap="round" strokeLinejoin="round"/>}

      {/* Nodes */}
      {pts.map((p,i)=>{
        const s=streak[p.idx]; if(!s) return null;
        const isToday=p.idx===doneCount;
        const done=s.done;
        const nr=isToday?20:15;
        return (
          <g key={i} transform={`translate(${p.x},${p.y})`}>
            {isToday && <circle r={30} fill={P.color.green} opacity=".1"/>}
            <ellipse rx={nr+1} ry={5} cy={nr+2} fill="rgba(0,0,0,.1)"/>
            <circle r={nr}
              fill={done?P.color.green:isToday?P.color.sand:P.color.stone}
              stroke={done?'#0A3D1F':isToday?'#C4A44A':P.color.border}
              strokeWidth={isToday?2.5:1.5}/>
            {done
              ? <path d="M-5 0l3.5 3.5 7-7" fill="none" stroke="white"
                  strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
              : <text x="0" y="5" textAnchor="middle"
                  fontFamily={P.font.ui} fontSize={isToday?11:9} fontWeight="700"
                  fill={isToday?P.color.black:P.color.ink3}>{s.day}</text>
            }
          </g>
        );
      })}

      {/* Real pig mascot at current position */}
      {curPt && (

function ScreenChallengeDetailV2({ nav }) {
  const [accepted, setAccepted] = React.useState(false);
  const [showReward, setShowReward] = React.useState(false);
  const done = 3;
  const totalPts = 55;
  const totalDays = 7;

  return (
    <div style={{ flex:1, backgroundColor:P.color.white, display:'flex',
      flexDirection:'column', position:'relative', overflow:'hidden' }}>
      <StatusBar light />
      <div style={{ position:'relative', height:190, flexShrink:0,
        background:`linear-gradient(160deg,${P.color.green} 0%,#1a6b3c 100%)` }}>
        <div style={{ position:'absolute', inset:0, opacity:.08,
          backgroundImage:'repeating-linear-gradient(45deg,white 0,white 1px,transparent 0,transparent 50%)',
          backgroundSize:'18px 18px' }}/>
        <NavBar transparent title="" onBack={()=>nav('__back__')} light />
        <div style={{ position:'absolute', bottom:20, left:24, right:24,
          display:'flex', alignItems:'flex-end', justifyContent:'space-between' }}>
          <div>
            <span style={{ fontFamily:P.font.body, fontSize:10, fontWeight:700,
              color:'rgba(255,255,255,.6)', textTransform:'uppercase', letterSpacing:1.2 }}>
              Day {done} of {totalDays}
            </span>
            <h1 style={{ fontFamily:P.font.display, fontWeight:700, fontSize:24,
              color:P.color.white, margin:'4px 0 4px', letterSpacing:'-.4px', lineHeight:1.1 }}>
              No-Spend Challenge
            </h1>
            <p style={{ fontFamily:P.font.body, fontSize:12,
              color:'rgba(255,255,255,.75)', margin:0 }}>
              Zero non-essential purchases for 7 days
            </p>
          </div>
          <PigMascot size={72} style={{ flexShrink:0 }} />
        </div>
      </div>

      <div style={{ flex:1, overflowY:'auto', backgroundColor:P.color.cream }}>
        {/* Stats */}
        <div style={{ display:'flex', gap:10, padding:'14px 20px 0' }}>
          {[
            {label:'Days Done', value:done,       icon:'check', c:P.color.green  },
            {label:'Points',    value:totalPts,   icon:'star',  c:P.color.neutral},
            {label:'Days Left', value:totalDays-done,icon:'bell',c:P.color.ink3  },
          ].map(s=>(
            <div key={s.label} style={{ flex:1, backgroundColor:P.color.white,
              borderRadius:P.r.lg, padding:'12px 8px', textAlign:'center', boxShadow:P.shadow.sm }}>
              <div style={{ width:28, height:28, borderRadius:'50%', backgroundColor:P.color.pinkLight,
                display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 4px' }}>
                <Icon name={s.icon} size={13} color={s.c}/>
              </div>
              <p style={{ fontFamily:P.font.display, fontWeight:700, fontSize:20,
                color:P.color.black, margin:'0 0 1px' }}>{s.value}</p>
              <p style={{ fontFamily:P.font.body, fontSize:9, color:P.color.ink3, margin:0 }}>{s.label}</p>
            </div>
          ))}
        </div>

        {/* Direct pig stage visual only */}
        <div style={{ margin:'14px 20px 0', display:'flex', justifyContent:'center' }}>
          <img
            src={FIGMA_CHALLENGE_PIG_2X}
            alt="Challenge pig achievement stage"
            style={{
              width:'239px',
              height:'332px',
              objectFit:'cover',
              borderRadius:20,
              display:'block'
            }}
          />
        </div>

        {/* Today's action */}
        <div style={{ margin:'12px 20px 0', backgroundColor:P.color.white,
          borderRadius:P.r.xl, padding:'18px', boxShadow:P.shadow.sm }}>
          <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:14 }}>

  'prioritizeSelect','prioritizeTournament','priorityResult',
  'home','challengeDetail','challengesList','notification','spending','goals','adjustment','profile',
  'categoryDetail','achievements','goalBuilder','goalBuilderSuccess','savingGoalDetail'
];
const SCREEN_LABELS = {
  welcome:'Welcome', onboardingIntro:'Penny Intro', login:'Login', createAccount:'Create Account',
  verifyEmail:'Verify Email', onboardTask:'Onboard Intro',
  prioritizeSelect:'Select Priorities', prioritizeTournament:'Rank 1v1',
  priorityResult:'Priority Result', home:'Home', challengeDetail:'Challenge Detail',
  challengesList:'All Challenges', notification:'Notifications', spending:'Spending Report',
  goals:'Goals', adjustment:'Adjustment', profile:'Profile',
  categoryDetail:'Category Detail', achievements:'Achievements',
  goalBuilder:'Add Goal', goalBuilderSuccess:'Goal Created', savingGoalDetail:'Saving Goal Detail'
};

function App() {
  const init = () => { try { return localStorage.getItem('penny_v2_screen')||'welcome'; } catch { return 'welcome'; }};
  const [screen,  setScreen]    = React.useState(init);
  const [navHistory, setNavHistory] = React.useState(() => [init()]);
  const [tab,     setTab]       = React.useState('home');
  const [animKey, setAnimKey]   = React.useState(0);
  const [priorities, setPriorities] = React.useState([]);
  const [ranked,     setRanked]     = React.useState([]);
  const [catId,      setCatId]       = React.useState('dineOut');
  const [goalMode,   setGoalMode]    = React.useState('routine');
  const [saveGoalId, setSaveGoalId]  = React.useState(SAVE_GOALS[0]?.id || 1);
  const [routineGoals, setRoutineGoals] = React.useState(ROUTINE_GOALS);
  const [saveGoals, setSaveGoals] = React.useState(SAVE_GOALS);
  const [createdGoal, setCreatedGoal] = React.useState(null);
  const [entryType, setEntryType]    = React.useState('existing');
  const [showReflectPopup, setShowReflectPopup] = React.useState(false);
  const [forceReflect, setForceReflect] = React.useState(false);
  const [showGuidePopup, setShowGuidePopup]     = React.useState(false);
  const [showCelebratePopup, setShowCelebratePopup] = React.useState(false);
  const [showSupportPopup, setShowSupportPopup] = React.useState(false);
  const [showHomeCoach, setShowHomeCoach] = React.useState(false);
  const [coachStep, setCoachStep] = React.useState(0);
  const [coachTapped, setCoachTapped] = React.useState(false);
  const [showBankUnlock, setShowBankUnlock] = React.useState(false);
  const [ribbonBurst, setRibbonBurst] = React.useState(false);
  const [celebrateCopy, setCelebrateCopy] = React.useState({
    title:'Great reflection!',
    sub:'Penny is proud of you. Your feedback helps us support your next better choice.',
  });

  React.useEffect(()=>{ try{localStorage.setItem('penny_v2_screen',screen);}catch{} },[screen]);

  React.useEffect(() => {
    if (screen !== 'home') return;
    if (showCelebratePopup || showSupportPopup) return;
    const reflectedThisSession = sessionStorage.getItem('penny_reflection_session_done') === '1';
    const guided = localStorage.getItem('penny_first_guide_done') === '1';
    const coached = localStorage.getItem('penny_main_tabs_coached') === '1';
    const bankLinked = localStorage.getItem('penny_bank_link_done') === '1';
    if (entryType === 'existing' && (forceReflect || !reflectedThisSession)) {
      setShowReflectPopup(true);
      setForceReflect(false);
      return;
    }
    if (entryType === 'new') {
      // New-user order: bank link first, then lightweight guided exploration.
      if (!bankLinked) {
        setShowBankUnlock(true);
        setShowGuidePopup(false);
        setShowHomeCoach(false);
        return;
      }
      if (!guided) {
        setShowGuidePopup(true);
        return;
      }
      if (!coached) {
        setCoachStep(0);
        setCoachTapped(false);
        setShowHomeCoach(true);
      }
    }
  }, [screen, entryType, showCelebratePopup, showSupportPopup]);

  React.useEffect(() => {
    const onEsc = (e) => {
      if (e.key !== 'Escape') return;
      if (showSupportPopup) { setShowSupportPopup(false); return; }
      if (showCelebratePopup) { setShowCelebratePopup(false); return; }
      if (showReflectPopup) { setShowReflectPopup(false); return; }
      if (showGuidePopup) { setShowGuidePopup(false); return; }
      if (showBankUnlock) { setShowBankUnlock(false); return; }
      if (showHomeCoach) { setShowHomeCoach(false); return; }
    };
    window.addEventListener('keydown', onEsc);
    return () => window.removeEventListener('keydown', onEsc);
  }, [showSupportPopup, showCelebratePopup, showReflectPopup, showGuidePopup, showBankUnlock, showHomeCoach]);

  React.useEffect(() => {
    if (!ribbonBurst) return;
    const t = setTimeout(() => setRibbonBurst(false), 1450);
    return () => clearTimeout(t);
  }, [ribbonBurst]);

  React.useEffect(()=>{
    const grid = document.getElementById('sm-grid');
    if (!grid) return;
    grid.innerHTML = '';
    ALL_SCREENS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'sm-btn';
      b.textContent = SCREEN_LABELS[s]||s;
      b.onclick = () => { nav(s); document.getElementById('screen-map').style.display='none'; };
      grid.appendChild(b);
    });
  }, []);

  React.useEffect(()=>{
    const onMsg = e => {
      if (e.data?.type==='__activate_edit_mode')   document.getElementById('tweak-panel').style.display='block';
      if (e.data?.type==='__deactivate_edit_mode') document.getElementById('tweak-panel').style.display='none';
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({type:'__edit_mode_available'},'*');

    const twGreen = document.getElementById('tw-green');
    const twPink  = document.getElementById('tw-pink');
    const twSand  = document.getElementById('tw-sand');
    const twScr   = document.getElementById('tw-screen');

    const applyTweak = () => {
      P.color.green     = twGreen.value;
      P.color.aligned   = twGreen.value;
      P.color.greenLight= twGreen.value+'22';
      P.color.pink      = twPink.value;
      P.color.pinkLight = twPink.value+'44';
      P.color.sand      = twSand.value;
      P.color.sandLight = twSand.value+'88';
    };

    twGreen.oninput = () => { applyTweak(); };
    twPink.oninput  = () => { applyTweak(); };
    twSand.oninput  = () => { applyTweak(); };
    twScr.onchange  = e => nav(e.target.value);

    const onKey = e => {
      if (e.key==='ArrowRight') { const i=ALL_SCREENS.indexOf(screen); if(i<ALL_SCREENS.length-1) nav(ALL_SCREENS[i+1]); }
      if (e.key==='ArrowLeft')  { const i=ALL_SCREENS.indexOf(screen); if(i>0) nav(ALL_SCREENS[i-1]); }
      if (e.key==='m'||e.key==='M') {
        const m=document.getElementById('screen-map');
        m.style.display = m.style.display==='none'?'flex':'none';
      }
      if (e.key==='t'||e.key==='T') {
        const p=document.getElementById('tweak-panel');
        p.style.display = p.style.display==='none'?'block':'none';
      }
    };
    window.addEventListener('keydown', onKey);
    return ()=>{ window.removeEventListener('message',onMsg); window.removeEventListener('keydown',onKey); };
  }, [screen]);

  const applyNavScreen = (nextScreen, { pushHistory=true, replaceHistory=false } = {}) => {
    setScreen(nextScreen);
    setAnimKey(k=>k+1);
    if (MAIN_TABS.includes(nextScreen)) setTab(nextScreen);
    try{ document.getElementById('tw-screen').value=nextScreen; }catch{}
    if (replaceHistory) {
      setNavHistory([nextScreen]);
      return;
    }
    if (pushHistory) {
      setNavHistory(prev => prev[prev.length-1] === nextScreen ? prev : [...prev, nextScreen]);
    }
  };

  const fallbackBackTarget = (from) => {
    const map = {
      login:'welcome',
      createAccount:'welcome',
      verifyEmail:'createAccount',
      onboardTask:'onboardingIntro',
      prioritizeSelect:'onboardTask',
      prioritizeTournament:'prioritizeSelect',
      priorityResult:'prioritizeTournament',
      challengeDetail:'home',
      challengesList:'home',
      notification:'home',
      categoryDetail:'spending',
      adjustment:'goals',
      achievements:'profile',
      goalBuilder:'goals',
      goalBuilderSuccess:'goals',
      savingGoalDetail:'goals',
    };
    return map[from] || 'home';
  };

  const nav = (s, extra, options={}) => {
    if (s === '__back__') {
      if (navHistory.length > 1) {
        const target = navHistory[navHistory.length - 2];
        setNavHistory(prev => prev.slice(0, -1));
        applyNavScreen(target, { pushHistory:false });
        return;
      }
      const fallback = fallbackBackTarget(screen);
      if (fallback && fallback !== screen) {
        applyNavScreen(fallback, { pushHistory:false, replaceHistory:true });
      }
      return;
    }
    if (extra?.catId) setCatId(extra.catId);
    if (extra?.mode) setGoalMode(extra.mode);
    if (extra?.saveGoalId) setSaveGoalId(extra.saveGoalId);
    if (extra?.entry) setEntryType(extra.entry);
    if (extra?.forceReflect) setForceReflect(true);
    if (showHomeCoach && MAIN_PAGE_TIPS[coachStep]?.tab === s) {
      setCoachTapped(true);
    }
    applyNavScreen(s, {
      pushHistory: options.pushHistory !== false,
      replaceHistory: options.replaceHistory === true,
    });
  };
  const navCat  = (id)   => nav('categoryDetail', {catId:id});
  const activeSaveGoal = saveGoals.find(g => g.id === saveGoalId) || saveGoals[0];

  const handleCreateGoal = (form) => {
    if (goalMode === 'routine') {
      const entry = {
        id: Date.now(),
        cat: form.cat,
        name: form.name.trim(),
        amount: Math.max(0, parseInt(form.amount, 10) || 0),
        plan: form.plan || 'Weekly',
        priority: routineGoals.length + 1,
      };
      const next = [...routineGoals, entry].map((g, i) => ({ ...g, priority:i+1 }));
      setRoutineGoals(next);
      setCreatedGoal(entry);
      nav('goalBuilderSuccess', { mode:'routine' });
      return;
    }
    const entry = {
      id: Date.now(),
      cat: form.cat,
      name: form.name.trim(),
      current: Math.max(0, parseInt(form.current, 10) || 0),
      target: Math.max(1, parseInt(form.amount, 10) || 1),
      color: P.color.green,
      image:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=60',
    };
    const next = [...saveGoals, entry];
    setSaveGoals(next);
    setSaveGoalId(entry.id);
    setCreatedGoal(entry);
    nav('goalBuilderSuccess', { mode:'save', saveGoalId: entry.id });
  };

  const renderScreen = () => {
    switch(screen) {
      case 'welcome':              return <ScreenWelcome nav={nav}/>;
      case 'onboardingIntro':      return <ScreenOnboardingIntro nav={nav}/>;
      case 'login':                return <ScreenLogin nav={nav}/>;
      case 'createAccount':        return <ScreenCreateAccount nav={nav}/>;
      case 'verifyEmail':          return <ScreenVerifyEmail nav={nav}/>;
      case 'onboardTask':          return <ScreenOnboardTask nav={nav}/>;
      case 'prioritizeSelect':     return <ScreenPrioritizeSelect nav={nav} setPriorities={setPriorities}/>;
      case 'prioritizeTournament': return <ScreenPrioritizeTournament nav={nav} priorities={priorities} setRanked={setRanked}/>;
      case 'priorityResult':       return <ScreenPriorityResult nav={nav} ranked={ranked} priorities={priorities}/>;
      case 'home':                 return <ScreenHome onTab={nav} nav={nav} navCat={navCat}/>;
      case 'challengesList':       return <ScreenChallengesList nav={nav}/>;
      case 'challengeDetail':      return <ScreenChallengeDetailV2 nav={nav}/>;
      case 'notification':         return <ScreenNotification nav={nav}/>;
      case 'spending':             return <ScreenSpendingV2 onTab={nav} navCat={navCat}/>;
      case 'goals':                return <ScreenGoals onTab={nav} nav={nav} routineGoals={routineGoals} saveGoals={saveGoals}/>;
      case 'adjustment':           return <ScreenAdjustment nav={nav} routineGoals={routineGoals} onSaveAdjustment={setRoutineGoals}/>;
      case 'categoryDetail':       return <ScreenCategoryDetail nav={nav} catId={catId}/>;
      case 'profile':              return <ScreenProfileV2 nav={nav} saveGoals={saveGoals}/>;
      case 'achievements':         return <ScreenAchievements nav={nav}/>;
      case 'goalBuilder':          return <ScreenGoalBuilder nav={nav} mode={goalMode} onCreateGoal={handleCreateGoal}/>;
      case 'goalBuilderSuccess':   return <ScreenGoalBuilderSuccess nav={nav} mode={goalMode} createdGoal={createdGoal}/>;
      case 'savingGoalDetail':     return <ScreenSavingGoalDetail nav={nav} goal={activeSaveGoal}/>;
      default:                     return <ScreenWelcome nav={nav}/>;
    }
  };

  const anyOverlayOpen = showGuidePopup || showReflectPopup || showCelebratePopup || showSupportPopup || showBankUnlock || showHomeCoach;
  const indicatorLight = anyOverlayOpen || screen === 'challengeDetail';

  return (
    <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',
      backgroundColor:P.color.white, overflow:'hidden'}}>
      <div key={animKey} className="screen-in"
        style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {renderScreen()}
      </div>
      {MAIN_TABS.includes(screen) && <BottomNav active={tab} onTab={nav}
        guideTab={showHomeCoach && !showGuidePopup && !showReflectPopup ? MAIN_PAGE_TIPS[coachStep]?.tab : null}/>}
      <GuidePopup open={showGuidePopup} onClose={() => {
        setShowGuidePopup(false);
        localStorage.setItem('penny_first_guide_done', '1');
        setCelebrateCopy({
          title:'Great start!',
          sub:'Penny: "You are all set. Explore freely, and I will stay by your side."',
        });
        setShowCelebratePopup(true);
      }}/>
      <ReflectionPopup open={showReflectPopup} onClose={() => {
        setShowReflectPopup(false);
        sessionStorage.setItem('penny_reflection_session_done', '1');
      }}
        onComplete={() => {
          sessionStorage.setItem('penny_reflection_session_done', '1');
          setCelebrateCopy({
            title:'Great reflection!',
            sub:'Penny is proud of you. Your feedback helps us support your next better choice.',
          });
          setShowCelebratePopup(true);
        }}/>
      <CelebrationPopup open={showCelebratePopup} onClose={() => setShowCelebratePopup(false)}
        onNeedSupport={() => { setShowCelebratePopup(false); setShowSupportPopup(true); }}
        title={celebrateCopy.title}
        sub={celebrateCopy.sub}/>
      <BankUnlockPopup open={showBankUnlock && screen==='home' && !showGuidePopup && !showReflectPopup && !showHomeCoach}
        onClose={() => setShowBankUnlock(false)}
        onConnected={() => {
          localStorage.setItem('penny_bank_link_done', '1');
          setShowBankUnlock(false);
          setCelebrateCopy({
            title:'Bank Sync Unlocked!',
            sub:'Your priority insights are now protected and live. Great job building a stronger money system.',
          });
          setRibbonBurst(true);
          setShowCelebratePopup(true);
        }}/>
      <RibbonCelebration open={ribbonBurst || showCelebratePopup} />
      <SupportFeedbackPopup open={showSupportPopup} onClose={() => setShowSupportPopup(false)} />
      <HomeOnboardingBubble
        open={showHomeCoach && MAIN_TABS.includes(screen) && !showGuidePopup && !showReflectPopup}
        step={coachStep}
        canNext={coachTapped}
        onSkip={() => {
          setShowHomeCoach(false);
          localStorage.setItem('penny_main_tabs_coached', '1');
          if (entryType === 'new' && localStorage.getItem('penny_bank_link_done') !== '1') {
            setShowBankUnlock(true);
          }
        }}
        onNext={() => {
          if (!coachTapped) return;
          if (coachStep >= MAIN_PAGE_TIPS.length - 1) {
            setShowHomeCoach(false);
            localStorage.setItem('penny_main_tabs_coached', '1');
            setCelebrateCopy({
              title:'You did it!',
              sub:'Penny: "Now you know every corner of your space. Let\'s build your money calm together."',
            });
            setShowCelebratePopup(true);
            return;
          }
          setCoachTapped(false);
          setCoachStep(s => s + 1);
        }}
      />
      <HomeIndicator light={indicatorLight} z={1400} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
